services:
  timetracker-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worktimetracker-server
    restart: unless-stopped
    ports:
      - "${PORT:-48291}:8080"
    environment:
      - API_KEY=${API_KEY:-changeme_worktimetracker_key}
      - ASPNETCORE_URLS=http://+:8080
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
